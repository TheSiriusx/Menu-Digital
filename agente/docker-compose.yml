# Stack del agente de panaderías: independiente del bot de uñas (otros nombres, otra red, otros puertos).
#   cp .env.example .env   (y completar)   ·   docker compose up -d --build
# Desde fuera de Docker solo se ven Evolution (127.0.0.1:8090) y el agente (127.0.0.1:3010), y SOLO en esta
# máquina. Para que la web (Vercel) llegue a Evolution: Tailscale Funnel hacia 127.0.0.1:8090 (ver LEEME.md).
name: panaderias

services:
  agente:
    build:
      context: ..
      dockerfile: agente/Dockerfile
    container_name: panaderias_agente
    restart: unless-stopped
    env_file: .env
    environment:
      EVOLUTION_API_URL: http://evolution:8080
      WHISPER_URL: http://whisper:9000
    volumes:
      - agente_datos:/app/agente/datos
    ports:
      - "127.0.0.1:3010:3000"
    depends_on:
      evolution:
        condition: service_started
    networks: [panaderias]

  evolution:
    image: evoapicloud/evolution-api:latest
    container_name: panaderias_evolution
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVER_URL: ${EVOLUTION_URL_PUBLICA:-http://localhost:8090}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      LANGUAGE: es
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${POSTGRES_PASSWORD}@postgres:5432/evolution
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://:${REDIS_PASSWORD}@redis:6379/1
      CACHE_REDIS_PREFIX_KEY: panaderias
      CACHE_LOCAL_ENABLED: "false"
    volumes:
      - evolution_instancias:/evolution/instances
    ports:
      - "127.0.0.1:8090:8080"
    networks: [panaderias]

  postgres:
    image: postgres:16-alpine
    container_name: panaderias_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: evolution
    volumes:
      - postgres_datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [panaderias]

  redis:
    image: redis:7-alpine
    container_name: panaderias_redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_datos:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [panaderias]

  # Transcribe los audios de los clientes. Local: el audio no sale de esta máquina (~1 GB de RAM en uso).
  whisper:
    image: onerahmet/openai-whisper-asr-webservice:latest
    container_name: panaderias_whisper
    restart: unless-stopped
    environment:
      ASR_MODEL: ${WHISPER_MODELO:-base}
      ASR_ENGINE: faster_whisper
    volumes:
      - whisper_cache:/root/.cache
    networks: [panaderias]

networks:
  panaderias:

volumes:
  agente_datos:
  evolution_instancias:
  postgres_datos:
  redis_datos:
  whisper_cache:
